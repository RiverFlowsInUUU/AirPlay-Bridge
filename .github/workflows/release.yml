name: 发布

# 只在**打 tag 发版**时跑完整构建。
#
# 为什么不跟着每次 push 跑：首次配置要 FetchContent 拉 Mbed TLS（约 190MB），
# Windows runner 上完整编一次要十分钟以上。平时改代码本地就会编，
# 不需要 CI 来发现编译错误（补丁那类"会腐烂的东西"另有 check-patch.yml 盯着）。
# 发版频率低，这时候花十分钟是值得的 —— 产物不依赖任何人的机器。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # 手动触发：只出产物不建 release，方便试打包（实测 2 分钟跑完）

permissions:
  contents: write         # 建 release 需要

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 取出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ★ 自检必须在本工作流内，不能依赖 check-patch.yml。
      #
      # 2026-10-17 踩过：tag 推上去时 `检查上游补丁` 是 failure，而本工作流的
      # `发布` job 照样 success —— 两个 workflow 相互独立，一个挂了不拦另一个。
      # 那次是我肉眼看到 failure 才删 tag 重发；下次未必有人盯着，就会直接
      # 打出一个装着废弃值的包。
      #
      # 所以把「LF 行尾 / 能 apply / 覆盖 4 个文件 / 防陈旧」都放进这里，
      # 让「tag → 包」这条路自己自洽。
      - name: 校验补丁（自检在构建前，失败即中止）
        shell: bash
        run: |
          P=patches/upstream-airplay2-sender-cpp.patch

          echo "── 行尾必须是 LF ──"
          if file "$P" | grep -q CRLF; then
            echo "::error::补丁是 CRLF 行尾，git apply 会失败。检查 .gitattributes"
            exit 1
          fi

          echo "── 防陈旧：补丁里必须含有工作区当前实现的标志行 ──"
          fail=0
          while IFS= read -r want; do
            [ -z "$want" ] && continue
            if ! grep -qF -- "$want" "$P"; then
              echo "::error::补丁里缺少片段：$want —— patches/ 已陈旧，与 third_party/ 工作区不一致"
              fail=1
            fi
          done <<'MARKERS'
               stream.emplace_back("latencyMax", Value::integer(88200));
               stream.emplace_back("latencyMin", Value::integer(11025));
          +    void setLatencyMs(int ms) {
          +        ap2_->eventIn  = hkdfSha512("Events-Salt",
          MARKERS
          if [ "$fail" -ne 0 ]; then
            echo "重新生成：cd third_party/airplay2-sender-cpp && git diff > ../../patches/upstream-airplay2-sender-cpp.patch"
            exit 1
          fi

          echo "── 能干净应用到上游 ──"
          cd third_party/airplay2-sender-cpp
          if ! git apply --check "../../$P"; then
            echo "::error::补丁打不上。上游可能改动了相关文件，需要重新生成补丁。"
            exit 1
          fi
          git apply "../../$P"

          echo "── 覆盖了预期的 4 个文件 ──"
          for f in CMakeLists.txt src/raop_sender.cpp src/raop_sender.h test/core_tests.cpp; do
            if ! git diff --name-only | grep -q "^$f$"; then
              echo "::error::补丁没有覆盖 $f —— 补丁可能不完整"
              exit 1
            fi
          done
          echo "补丁校验通过（4 个文件）"

      # 文档自检也放进来 —— 理由和上面的补丁校验一样：
      # `check-docs.yml` 和本工作流相互独立，一个挂了不拦另一个。
      # 它只跑一个 Python 脚本（不到 1 秒），但能拦住「README 的档位表过时了」
      # 这种「用户会照着做错事」的问题。规矩见 docs/RULES.md C14。
      - name: 核对文档声明与代码真值
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_docs.py

      - name: 读版本号
        id: ver
        shell: bash
        # 版本号的唯一来源是 CMakeLists.txt 的 project(... VERSION x.y.z)，
        # 这里读出来传给打包脚本 —— 不另外维护一份。
        run: |
          V=$(sed -n 's/.*project(airplay_bridge VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$V" ]; then echo "::error::没能从 CMakeLists.txt 读出版本号"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号：$V"

      - name: 配置
        run: cmake -S . -B build -A x64

      - name: 编译
        run: cmake --build build --config Release --target airplay_bridge

      # 测试必须在打包之前跑 —— 分块不变性那类问题只影响音质、不影响编译，
      # 一旦漏过去就是「装完能连上但声音不对」，比编译失败难查得多。
      - name: 编译并运行测试
        run: |
          # ★ 编「默认目标」而不是点名某个测试。
          #   点名的话，以后新增测试目标时忘了改这里，ctest 会报
          #   「找不到可执行文件」—— 而那是在 tag 推上去之后才炸。
          #   默认目标包含全部测试（主程序上一步已经编过，这里是空操作）。
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      # ★ 协议层回归网。
      #
      # 主构建强制 AIRPLAY_BUILD_TESTS=OFF（只建库，不建示例/测试），
      # 所以上游那套 core_tests / loop_tests **从来没被跑过**。
      # 结果：补丁里的实现和测试断言早就自相矛盾了，一直没人知道
      # （2026-10-18 外部审查发现；实测 224/231 通过，7 项失败）。
      #
      # 这里单独建一次上游测试并跑 —— 它是我们和协议引擎之间的唯一安全网。
      - name: 编译并运行上游协议测试
        shell: bash
        run: |
          cmake -S third_party/airplay2-sender-cpp -B tbuild -A x64 \
                -DAIRPLAY_BUILD_TESTS=ON \
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build tbuild --config Release --parallel
          ctest --test-dir tbuild -C Release --output-on-failure

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      # 只发布安装版 —— 不再出免安装的裸 exe。
      #
      # 原因：防火墙放行规则和开机自启项都是按 exe 的**完整路径**记录的。
      # 安装版永远落在同一个固定路径上，升级不会失效；而免安装版用户一换位置
      # 或改名，两者的系统集成就全断。更麻烦的是两种版本同时留在机器上时，
      # 两份路径不同 → 谁点一次「修复连接问题」就把对方的放行规则顶掉 →
      # 两份轮流提示「未被防火墙放行」，永远修不好（v1.2.51 用户实际踩到）。
      # 少一个分叉就少一类问题。
      - name: 打包安装程序
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\airplay-bridge.iss

      - name: 产物清单（人工核对用）
        shell: bash
        run: |
          echo "=== 本次产物 ==="
          ls -la dist/*.exe

      - name: 从 CHANGELOG 提取本版说明
        id: notes
        shell: bash
        # 发布说明的内容跟 CHANGELOG.md 是同一份 —— 不另写一遍，
        # 免得两处漂移（老板对发布说明的文风有硬要求，见 AGENTS.md）。
        run: |
          V="${{ steps.ver.outputs.version }}"
          # 提取本版说明，并把「续行」合并回上一行。
          #
          # 为什么要合并：CHANGELOG.md 是按 ~80 列手动折行的（便于阅读与 diff），
          # 但 GitHub 对 **release 正文 / issue 评论** 用的是「单个换行 = 硬换行」
          # 的渲染规则（跟仓库里的 .md 文件不同 —— 那里单换行会被合并成空格）。
          # 直接把折行过的文本当正文，页面上就会「没写到边就换行」。
          # 所以只在生成正文这一步把续行接回去，CHANGELOG 本身保持折行。
          #
          # 接续规则：行首两个空格、且不是列表项/表格 → 判定为续行。
          # 接缝处的空格：两侧都是可打印 ASCII 才补空格（中文之间不能有空格）。
          awk -v v="$V" '
            function isasciiw(c) { return (c != "" && c ~ /^[ -~]$/) }
            function lastc(s) { return substr(s, length(s), 1) }
            function firstc(s) { sub(/^[ 	]+/, "", s); return substr(s, 1, 1) }
            index($0, "## [" v "]") == 1 { f = 1; next }
            f && index($0, "## [") == 1 { exit }
            f {
              body = $0; sub(/^[ 	]+/, "", body)
              merge = (outn > 0 && out[outn] ~ /[^ 	]/                        && out[outn] !~ /^[ 	]*(```|#|\|)/                        && $0 ~ /^  / && body != ""                        && $0 !~ /^[ 	]*[-*+][ 	]/ && $0 !~ /^[ 	]*\|/)
              if (merge) {
                sep = (isasciiw(lastc(out[outn])) && isasciiw(firstc($0))) ? " " : ""
                out[outn] = out[outn] sep body
                next
              }
              out[++outn] = $0
            }
            END { for (i = 1; i <= outn; ++i) print out[i] }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md 里没找到 v$V 那一节，发布说明会为空"
          fi
          echo "--- 本版说明 ---"; cat release-notes.md

      - name: 建 release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/AirPlay-Bridge-Setup-v${{ steps.ver.outputs.version }}.exe

      - name: 手动触发时留存产物
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AirPlay-Bridge-v${{ steps.ver.outputs.version }}
          path: |
            dist/AirPlay-Bridge-Setup-v*.exe
