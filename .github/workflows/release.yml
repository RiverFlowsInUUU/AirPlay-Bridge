name: 发布

# 只在**打 tag 发版**时跑完整构建。
#
# 为什么不跟着每次 push 跑：首次配置要 FetchContent 拉 Mbed TLS（约 190MB），
# Windows runner 上完整编一次要十分钟以上。平时改代码本地就会编，
# 不需要 CI 来发现编译错误（补丁那类"会腐烂的东西"另有 check-patch.yml 盯着）。
# 发版频率低，这时候花十分钟是值得的 —— 产物不依赖任何人的机器。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # 手动触发：只出产物不建 release，方便试打包（实测 2 分钟跑完）

permissions:
  contents: write         # 建 release 需要

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 取出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 打上游补丁
        shell: bash
        run: |
          cd third_party/airplay2-sender-cpp
          git apply ../../patches/upstream-airplay2-sender-cpp.patch
          echo "补丁已应用"

      - name: 读版本号
        id: ver
        shell: bash
        # 版本号的唯一来源是 CMakeLists.txt 的 project(... VERSION x.y.z)，
        # 这里读出来传给打包脚本 —— 不另外维护一份。
        run: |
          V=$(sed -n 's/.*project(airplay_bridge VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$V" ]; then echo "::error::没能从 CMakeLists.txt 读出版本号"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号：$V"

      - name: 配置
        run: cmake -S . -B build -A x64

      - name: 编译
        run: cmake --build build --config Release --target airplay_bridge

      # 测试必须在打包之前跑 —— 分块不变性那类问题只影响音质、不影响编译，
      # 一旦漏过去就是「装完能连上但声音不对」，比编译失败难查得多。
      - name: 编译并运行测试
        run: |
          cmake --build build --config Release --target resampler_test
          ctest --test-dir build -C Release --output-on-failure

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      # 只发布安装版 —— 不再出免安装的裸 exe。
      #
      # 原因：防火墙放行规则和开机自启项都是按 exe 的**完整路径**记录的。
      # 安装版永远落在同一个固定路径上，升级不会失效；而免安装版用户一换位置
      # 或改名，两者的系统集成就全断。更麻烦的是两种版本同时留在机器上时，
      # 两份路径不同 → 谁点一次「修复连接问题」就把对方的放行规则顶掉 →
      # 两份轮流提示「未被防火墙放行」，永远修不好（v1.2.51 用户实际踩到）。
      # 少一个分叉就少一类问题。
      - name: 打包安装程序
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\airplay-bridge.iss

      - name: 产物清单（人工核对用）
        shell: bash
        run: |
          echo "=== 本次产物 ==="
          ls -la dist/*.exe

      - name: 从 CHANGELOG 提取本版说明
        id: notes
        shell: bash
        # 发布说明的内容跟 CHANGELOG.md 是同一份 —— 不另写一遍，
        # 免得两处漂移（老板对发布说明的文风有硬要求，见 AGENTS.md）。
        run: |
          V="${{ steps.ver.outputs.version }}"
          awk -v v="$V" '
            index($0, "## [" v "]") == 1 { f=1; next }
            f && index($0, "## [") == 1 { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md 里没找到 v$V 那一节，发布说明会为空"
          fi
          echo "--- 本版说明 ---"; cat release-notes.md

      - name: 建 release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/AirPlay-Bridge-Setup-v${{ steps.ver.outputs.version }}.exe

      - name: 手动触发时留存产物
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AirPlay-Bridge-v${{ steps.ver.outputs.version }}
          path: |
            dist/AirPlay-Bridge-Setup-v*.exe
