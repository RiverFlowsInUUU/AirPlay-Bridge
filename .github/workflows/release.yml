name: 发布

# 只在**打 tag 发版**时跑完整构建。
#
# 为什么不跟着每次 push 跑：首次配置要 FetchContent 拉 Mbed TLS（约 190MB），
# Windows runner 上完整编一次要十分钟以上。平时改代码本地就会编，
# 不需要 CI 来发现编译错误（补丁那类"会腐烂的东西"另有 check-patch.yml 盯着）。
# 发版频率低，这时候花十分钟是值得的 —— 产物不依赖任何人的机器。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # 手动触发：只出产物不建 release，方便试打包

permissions:
  contents: write         # 建 release 需要

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 取出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 打上游补丁
        shell: bash
        run: |
          cd third_party/airplay2-sender-cpp
          git apply ../../patches/upstream-airplay2-sender-cpp.patch
          echo "补丁已应用"

      - name: 读版本号
        id: ver
        shell: bash
        # 版本号的唯一来源是 CMakeLists.txt 的 project(... VERSION x.y.z)，
        # 这里读出来传给打包脚本 —— 不另外维护一份。
        run: |
          V=$(sed -n 's/.*project(airplay_bridge VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$V" ]; then echo "::error::没能从 CMakeLists.txt 读出版本号"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号：$V"

      - name: 配置
        run: cmake -S . -B build -A x64

      - name: 编译
        run: cmake --build build --config Release --target airplay_bridge

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 打包安装程序
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\airplay-bridge.iss

      - name: 裸 exe 改名（带版本号，方便用户分辨下载的是哪一版）
        shell: bash
        run: |
          cp build/Release/airplay_bridge.exe "AirPlay-Bridge-v${{ steps.ver.outputs.version }}.exe"
          ls -la "AirPlay-Bridge-v${{ steps.ver.outputs.version }}.exe"

      - name: 产物清单（人工核对用）
        shell: bash
        run: |
          echo "=== 本次产物 ==="
          ls -la dist/*.exe
          ls -la AirPlay-Bridge-v*.exe

      - name: 建 release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AirPlay-Bridge-Setup-v${{ steps.ver.outputs.version }}.exe
            AirPlay-Bridge-v${{ steps.ver.outputs.version }}.exe

      - name: 手动触发时留存产物
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AirPlay-Bridge-v${{ steps.ver.outputs.version }}
          path: |
            dist/AirPlay-Bridge-Setup-v*.exe
            AirPlay-Bridge-v*.exe
